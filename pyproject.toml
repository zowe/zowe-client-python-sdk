[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
log_level = "CRITICAL"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.pydoclint]
style = "numpy"
check-arg-order = false
require-return-section-when-returning-nothing = false
quiet = true
exclude = "build|response"
